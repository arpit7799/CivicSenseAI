[project]
name = "civicsense-ai"
version = "0.1.0"
description = "Multimodal AI civic complaint generation, road damage detection, and municipal grievance routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
